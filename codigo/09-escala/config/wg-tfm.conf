# TFM v2 - block 16: the host joins the management VPN as peer 10.10.0.4 (only the CA is reachable).
# The private key is loaded from /etc/wireguard/wg-tfm.key (mode 600) and is not stored here.
[Interface]
Address = 10.10.0.4/32
MTU = 1420
PostUp = wg set %i private-key /etc/wireguard/wg-tfm.key

[Peer]
# ca (hub), reached through the NAT Network UDP forward bound to 127.0.0.1
PublicKey = <public key>
Endpoint = 127.0.0.1:51820
AllowedIPs = 10.10.0.1/32
PersistentKeepalive = 25
